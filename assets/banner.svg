<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#0a0e17;border-radius:16px;overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0px, 0px); }
        50% { opacity: 0.65; transform: scale(1.18) translate(15px, -15px); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.2deg); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes beamScan {
        0% { transform: translateX(-400px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes layerStackWave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .animated-glow-cyan {
        transform-origin: 300px 180px;
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .animated-glow-purple {
        transform-origin: 900px 240px;
        animation: pulseGlow 10s ease-in-out 2s infinite alternate;
      }
      .card-float-1 {
        transform-origin: center;
        animation: floatCard1 7s ease-in-out infinite;
      }
      .card-float-2 {
        transform-origin: center;
        animation: floatCard2 9s ease-in-out infinite;
      }
      .card-float-3 {
        transform-origin: center;
        animation: floatCard3 6s ease-in-out infinite;
      }
      .beam-line {
        animation: beamScan 6s ease-in-out infinite;
      }
      .layer-item {
        animation: layerStackWave 4s ease-in-out infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .text-pill {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle Designer Canvas Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.8">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="880" y1="0" x2="880" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1040" y1="0" x2="1040" y2="420"/>
    <line x1="1120" y1="0" x2="1120" y2="420"/>
  </g>

  <!-- Ambient Animated Glow Spheres (Background only, under text) -->
  <circle cx="280" cy="160" r="280" fill="url(#glowCyan)" class="animated-glow-cyan" />
  <circle cx="980" cy="220" r="320" fill="url(#glowPurple)" class="animated-glow-purple" />

  <!-- Animated Laser Scan Beam along top border -->
  <line x1="0" y1="2" x2="400" y2="2" stroke="url(#primaryGrad)" stroke-width="3" class="beam-line" filter="url(#glowFilter)"/>

  <!-- ================= BACKGROUND FLOATING CARDS (Positioned to the right to NEVER overlap text) ================= -->
  <g id="right-side-illustrations" transform="translate(820, 45)">
    <!-- Card 1: Layer Compositing Stack -->
    <g class="card-float-1" filter="url(#dropShadow)">
      <rect x="0" y="30" width="310" height="150" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="24" cy="54" r="5" fill="#f43f5e" />
      <circle cx="40" cy="54" r="5" fill="#facc15" />
      <circle cx="56" cy="54" r="5" fill="#4ade80" />
      <text x="80" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">LAYER COMPOSITING STACK</text>
      
      <!-- Layer items inside card -->
      <g transform="translate(18, 72)">
        <rect x="0" y="0" width="274" height="26" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
        <text x="12" y="17" fill="#38bdf8" font-family="monospace" font-size="11">⚡ Adjustments: Non-Destructive Curves</text>
      </g>
      <g transform="translate(18, 104)">
        <rect x="0" y="0" width="274" height="26" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
        <text x="12" y="17" fill="#818cf8" font-family="monospace" font-size="11">🎨 Mask Layer: Alpha Mattes 32-bit</text>
      </g>
      <g transform="translate(18, 136)">
        <rect x="0" y="0" width="274" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="12" y="17" fill="#94a3b8" font-family="monospace" font-size="11">📁 Base Canvas: GPU Vulkan Pipeline</text>
      </g>
    </g>

    <!-- Card 2: Engine Performance & Formats Chip -->
    <g class="card-float-2" transform="translate(40, 205)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="280" height="105" rx="12" fill="url(#cardGrad2)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="20" y="28" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">🎨 Native Engine &amp; Formats</text>
      
      <rect x="20" y="44" width="70" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="55" y="59" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">.PSD / PSB</text>

      <rect x="98" y="44" width="70" height="22" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
      <text x="133" y="59" fill="#f472b6" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">RAW / DNG</text>

      <rect x="176" y="44" width="84" height="22" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="218" y="59" fill="#4ade80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">GEGL / Rust</text>

      <!-- Mini visual waveform/bar -->
      <g transform="translate(20, 78)">
        <rect x="0" y="4" width="240" height="6" rx="3" fill="#0f172a"/>
        <rect x="0" y="4" width="180" height="6" rx="3" fill="url(#primaryGrad)"/>
      </g>
    </g>

    <!-- Floating Mini Badge: 60 FPS / GPU -->
    <g class="card-float-3" transform="translate(-30, 260)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="130" height="38" rx="19" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="6" fill="#22c55e"/>
      <text x="36" y="24" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">60 FPS GPU</text>
    </g>
  </g>

  <!-- ================= FOREGROUND TEXT & CONTENT (Unobstructed & High Contrast) ================= -->
  <g id="foreground-content" transform="translate(60, 50)">
    
    <!-- Top Category Pill -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="235" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" filter="url(#glowFilter)"/>
      <text x="30" y="20" fill="#38bdf8" class="text-pill">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title (Gradient & Bold) -->
    <text x="0" y="105" fill="url(#primaryGrad)" font-size="44" class="text-title" filter="url(#dropShadow)">
      Raster Graphics &amp; Photo Editing
    </text>

    <!-- Secondary Heading line -->
    <text x="0" y="148" fill="#ffffff" font-size="34" class="text-title" filter="url(#dropShadow)">
      Software Ecosystem
    </text>

    <!-- Subtitle description -->
    <text x="0" y="194" fill="#94a3b8" font-size="16.5" class="text-subtitle">
      A comprehensive directory of top-tier open-source GitHub projects,
    </text>
    <text x="0" y="222" fill="#94a3b8" font-size="16.5" class="text-subtitle">
      professional SaaS suites, GPU-accelerated workflows &amp; RAW darkrooms.
    </text>

    <!-- Feature Tags / Highlights Bar (Foreground) -->
    <g transform="translate(0, 265)">
      <!-- Pill 1: Layer Compositing -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">🥞 Layer Compositing</text>
      </g>

      <!-- Pill 2: Non-Destructive -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="162" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">✨ Non-Destructive</text>
      </g>

      <!-- Pill 3: PSD Fidelity -->
      <g transform="translate(354, 0)">
        <rect x="0" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">🎯 PSD Fidelity</text>
      </g>

      <!-- Pill 4: GPU Accelerated -->
      <g transform="translate(506, 0)">
        <rect x="0" y="0" width="164" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">🚀 GPU Accelerated</text>
      </g>
    </g>

    <!-- Secondary Meta Row -->
    <g transform="translate(0, 318)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="12">
        OPEN-SOURCE FOSS • SAAS COMMERCIAL • RUST &amp; C++ NATIVE • BROWSER CLIENT-SIDE
      </text>
    </g>

  </g>
</svg>
